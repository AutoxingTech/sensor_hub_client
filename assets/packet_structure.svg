<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 0 700 240" width="100%" style="max-width: 700px;">
  <style>
    .grid { stroke: #8b949e; stroke-width: 1.5; fill: transparent; }
    .text-title { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 14px; fill: #24292f; text-anchor: middle; font-weight: 600; }
    .text-desc { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 12px; fill: #57606a; text-anchor: middle; }
    .label { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 12px; fill: #57606a; text-anchor: middle; }
    .bg-header { fill: #f6f8fa; }
    .bg-data { fill: #f0f3f6; stroke-dasharray: 6 4; }
    @media (prefers-color-scheme: dark) {
      .grid { stroke: #484f58; }
      .text-title { fill: #c9d1d9; }
      .text-desc { fill: #8b949e; }
      .label { fill: #8b949e; }
      .bg-header { fill: #161b22; }
      .bg-data { fill: #0d1117; }
    }
  </style>
  
  <!-- Bit labels -->
  <text x="0" y="20" class="label" text-anchor="start">0</text>
  <text x="160" y="20" class="label">7</text>
  <text x="320" y="20" class="label">15</text>
  <text x="480" y="20" class="label">23</text>
  <text x="640" y="20" class="label" text-anchor="end">31</text>
  
  <!-- Ticks -->
  <path d="M1 25 V30 M160 25 V30 M320 25 V30 M480 25 V30 M639 25 V30" class="grid" stroke-width="1" />
  
  <!-- Row 1: Header (2B), Length[0:15] (2B) -->
  <rect x="1" y="30" width="319" height="40" class="grid bg-header" />
  <text x="160" y="55" class="text-title">帧头 / Header (2B)</text>
  
  <rect x="320" y="30" width="319" height="40" class="grid bg-header" />
  <text x="480" y="55" class="text-title">长度 / Length [0:15]</text>
  
  <!-- Row 2: Length[16:31] (2B), CRC16 (2B) -->
  <rect x="1" y="70" width="319" height="40" class="grid bg-header" />
  <text x="160" y="95" class="text-title">长度 / Length [16:31]</text>
  
  <rect x="320" y="70" width="319" height="40" class="grid bg-header" />
  <text x="480" y="95" class="text-title">CRC16 (2B, LE)</text>
  
  <!-- Row 3: Data (n bytes) -->
  <rect x="1" y="110" width="638" height="120" class="grid bg-data" />
  <text x="320" y="150" class="text-title">数据区 / Data (n bytes)</text>
  <text x="320" y="180" class="text-desc">ROS 消息序列化后的字节流</text>
  <text x="320" y="205" class="text-desc">ros::serialization::serialize(msg)</text>
</svg>